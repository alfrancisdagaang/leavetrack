name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0" # husky's prepare script must not run in CI

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # no credentials: Day 0 builds without any env vars

  db-verify:
    name: Migrations + seed (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Reference data ships with migrations (before seed)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n int;
          begin
            select count(*) into n from public.leave_types
            where (id, name, tracks_balance) in (
              ('10000000-0000-4000-8000-000000000001'::uuid, 'Vacation', true),
              ('10000000-0000-4000-8000-000000000002'::uuid, 'Sick',     true),
              ('10000000-0000-4000-8000-000000000003'::uuid, 'Unpaid',   false));
            if n <> 3 or (select count(*) from public.leave_types) <> 3 then
              raise exception 'leave_types must be seeded by migrations alone (db push skips seed.sql)';
            end if;
          end $$;
          SQL
      - name: Seed twice (proves idempotency, the second run changes no row count)
        run: |
          counts() {
            psql -v ON_ERROR_STOP=1 -At -c "select (select count(*) from public.users), (select count(*) from public.leave_policies), (select count(*) from public.leave_balances), (select count(*) from public.leave_requests), (select count(*) from public.audit_log)"
          }
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          first=$(counts)
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          second=$(counts)
          echo "after first run: $first; after second run: $second"
          test "$first" = "$second"
      - name: Verify schema invariants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verify_schema.sql
      - name: Verify seed data (three-role model)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verify_seed.sql

  db-push:
    name: Push migrations to Supabase
    needs: [check, db-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }} # DIRECT (5432) connection string
    steps:
      - name: Skip when Supabase is not configured (Day 0)
        if: env.SUPABASE_DB_URL == ''
        run: echo "SUPABASE_DB_URL secret not set — skipping db push."
      - uses: actions/checkout@v7
        if: env.SUPABASE_DB_URL != ''
      - uses: actions/setup-node@v7
        if: env.SUPABASE_DB_URL != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.SUPABASE_DB_URL != ''
        run: npm ci
      - if: env.SUPABASE_DB_URL != ''
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
